<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <title>Информация о продукте</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f7ff;
      --card: #ffffff;
      --text: #162033;
      --muted: #64708b;
      --accent: #4f6cff;
      --accent-soft: #eef2ff;
      --border: #e7ebf5;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; min-height: 100%; }
    body {
      font-family: Arial, Segoe UI, Roboto, system-ui, -apple-system, sans-serif;
      background: linear-gradient(180deg, var(--bg) 0%, #eff4ff 100%);
      color: var(--text);
      padding: 16px 12px 28px;
      line-height: 1.5;
    }

    .page {
      max-width: 820px;
      margin: 0 auto;
      display: grid;
      gap: 14px;
    }

    .hero, .block {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: 0 8px 24px rgba(23, 35, 67, 0.06);
      padding: 16px;
    }

    .hero {
      background: linear-gradient(135deg, #ffffff 0%, #f2f6ff 100%);
    }

    .badge {
      display: inline-block;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--accent);
      background: var(--accent-soft);
      border-radius: 999px;
      padding: 6px 10px;
      margin-bottom: 10px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 22px;
      line-height: 1.2;
    }

    .hero p {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
    }

    .section-title {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 12px;
    }

    .gallery, .quotes, .likes, .stats {
      display: grid;
      gap: 10px;
    }

    .gallery {
      grid-template-columns: 1fr 1fr;
    }

    .card {
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      background: #fbfcff;
    }

    .card .label {
      padding: 10px 12px 0;
      font-size: 13px;
      font-weight: 700;
      color: var(--accent);
    }

    .card img {
      display: block;
      width: 100%;
      height: 180px;
      object-fit: cover;
    }

    .quote {
      border-left: 3px solid var(--accent);
      padding: 12px 14px;
      background: #fbfcff;
      border-radius: 12px;
      color: var(--text);
      font-size: 14px;
    }

    .quote cite {
      display: block;
      margin-top: 6px;
      color: var(--muted);
      font-style: normal;
      font-size: 12px;
    }

    .likes {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .like-item {
      background: #fbfcff;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
    }

    .like-item strong {
      display: block;
      font-size: 18px;
      color: var(--accent);
      margin-bottom: 4px;
    }

    .like-item span {
      color: var(--muted);
      font-size: 13px;
    }

    .stats {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .stat-card {
      padding: 12px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--accent-soft) 0%, #f7f9ff 100%);
      border: 1px solid var(--border);
    }

    .stat-card .value {
      display: block;
      font-size: 20px;
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 4px;
    }

    .stat-card .label {
      color: var(--muted);
      font-size: 13px;
    }

    @media (max-width: 640px) {
      .gallery, .likes, .stats { grid-template-columns: 1fr; }
      .card img { height: 160px; }
    }
  </style>
</head>
<body>
  <div class="page">
    <section class="hero">
      <div class="badge">Два набора</div>
      <h1>Набор скриншотов с лайками и набор обычных скриншотов</h1>
      <p>На странице показано два отдельных блока: один — скриншоты с лайками, второй — просто скриншоты для наглядной презентации.</p>
    </section>

    <section class="block">
      <div class="section-title">Набор скриншотов с лайками</div>
      <div class="gallery">
        <article class="card">
          <img src="images/screenshoot/likes.jpg" alt="Скриншот с лайками">
        </article>
        <article class="card">
          <img src="images/screenshoot/likes2.jpg" alt="Скриншот с лайками">
        </article>
        <article class="card">
          <img src="images/screenshoot/likes3.jpg" alt="Скриншот с лайками">
        </article>
        <article class="card">
          <img src="images/screenshoot/likes4.jpg" alt="Скриншот с лайками">
        </article>
      </div>
    </section>

    <section class="block">
      <div class="section-title">Набор обычных скриншотов</div>
      <div class="gallery">
        <article class="card">
          <img src="images/screenshoot/statistics.jpg" alt="Обычный скриншот">
        </article>
        <article class="card">
          <img src="images/screenshoot/statistics3.jpg" alt="Обычный скриншот">
        </article>
        <article class="card">
          <img src="images/screenshoot/statistic.jpg" alt="Обычный скриншот">
        </article>
        <article class="card">
          <img src="images/screenshoot/statistics31`.jpg" alt="Обычный скриншот">
        </article>
      </div>
    </section>

    <section class="block">
      <div class="section-title">Дополнительные примеры</div>
      <div class="gallery">
        <article class="card">
          <img src="images/screenshoot/likes54.jpg" alt="Скриншот с лайками">
        </article>
        <article class="card">
          <img src="images/screenshoot/likes5.jpg" alt="Скриншот с лайками">
        </article>
        <article class="card">
          <img src="images/screenshoot/likes6.jpg" alt="Скриншот с лайками">
        </article>
        <article class="card">
          <img src="images/screenshoot/lekes.jpg" alt="Скриншот с лайками">
        </article>
      </div>
    </section>
  </div>

  <script>
    (function(){
      const tg = window.Telegram && window.Telegram.WebApp;
      if(!tg) return;
      try{ tg.expand(); }catch(e){}
      try{ tg.MainButton.setText('Подробнее'); tg.MainButton.show(); }catch(e){}
      tg.ready();
    })();
  </script>
</body>
</html>
