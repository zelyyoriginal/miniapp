<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"> 
<meta name="theme-color" content="#ffffff">
<script src="https://telegram.org/js/telegram-web-app.js?56"></script>

<title>Fullscreen Gallery</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    min-height: 100%;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    color: var(--tg-theme-text-color, #000000);
    background-color: var(--tg-theme-secondary-bg-color, rgba(255,255,255,0.05));
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    min-height: 100vh;
    text-align: center;
    padding: 0;
    box-sizing: border-box;
    overflow-x: hidden;
}

/* safe area for notch devices */
body { padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom); }

.section {
    position: relative;
    width: auto;
    height: auto;
    overflow: hidden;
    display: inline-block;
    margin: 0 auto;
    border-radius: 12px;
}

.section img {
    width: 100%;
    height: auto;
    max-width: 100vw;
    max-height: 130vh;
    object-fit: contain;
    display: block;
}

.photo-button {
    position: absolute;
    left: 74%;
    top: 72%;
    transform: translate(-50%, -50%);
    border: none;
    background: transparent;
    padding: 0;
    margin: 0;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    line-height: 0;
    font-size: 0;
    width: clamp(40px, 50%, 3000px);
    height: auto;
    cursor: pointer;
    z-index: 2;
}

.photo-button img {
    display: block;
    width: 100%;
    height: auto;
    border-radius: 12px;
    animation: button-swing 3s ease-in-out infinite;
}

@keyframes button-swing {
    0%, 100% {
        transform: translateX(0) rotate(0deg);
    }
    25% {
        transform: translateX(-2%) rotate(-3deg);
    }
    50% {
        transform: translateX(0) rotate(0deg);
    }
    75% {
        transform: translateX(2%) rotate(3deg);
    }
}

.divider{
    height:2px;
    display:flex;

}




</style>

</head>
<body>

<section class="section">
    <img src="images/photo0.jpg" alt="Фото 1">
</section>

<div class="divider"></div>
<style>
.button_info{

    position: absolute;
    left: 47%;
    top: 47%;
    width: clamp(40px, 50%, 3000px);
    height: auto;
    background: transparent;
    border: none;
}</style>

<section class="section">
    <img src="images/photo0.1.png" alt="Фото 1">
    <button class="button_info">
        <img src="images/pay.png" alt="Фотоinfo">
    </button>
</section>



<div class="divider"></div>
<section class="section">
    <img src="images/photo1.jpg" alt="Фото 1">
</section>
<div class="divider"></div>
<section class="section">
    <img src="images/photo2.jpg" alt="Фото 2">
</section>
<div class="divider"></div>
<section class="section">
    <img src="images/photo2.1.jpg" alt="Фото 2">
    <button class="photo-button" onclick="window.location.href='info.html'">
        <img src="images/Button.png" alt="Фотоpay">
    </button>
</section>
<div class="divider"></div>

<section class="section">
    <img src="images/photo3.jpg" alt="Фото 3">
</section>
<div class="divider"></div>

<section class="section">
    <img src="images/photo4.jpg" alt="Фото 4">
</section>
<div class="divider"></div>



<style>
.button41 {
    position: absolute;
    left: 22%;
    top: 44%;
    width: clamp(40px, 55%, 3000px);
    height: auto;
    background: transparent;
    border: none;
}
</style>

<section class="section">
    <img src="images/photo4.1.jpg" alt="Фото 4">
    <button class="button41">
        <img src="images/button4.1.png" alt="Фотоpay">
    </button>
</section>

 

<div class="divider"></div>

<section class="section">
    <img src="images/photo5.jpg" alt="Фото 5">
</section>

<script>
    const tg = window.Telegram && window.Telegram.WebApp;
    if (tg) {
        try {
            tg.BackButton.hide();
        } catch (error) {
            console.warn('Telegram WebApp BackButton hide failed', error);
        }
        tg.ready();
    }

    const buttonInfo = document.querySelector('.button_info');
    const buttonInfo2 = document.querySelector('.button41');

    buttonInfo.addEventListener('click', () => {
       openPay();
    });
    buttonInfo2.addEventListener('click', () => {
        openPay();
    });

  function openPay() {
    const payUrl = 'https://link.payform.ru/?paymentLinkId=13d81b22-4ec6-4618-89f0-1d6641ef8713';
        if (tg && typeof tg.openLink === 'function') {
            tg.openLink(payUrl);
        } else {
            window.location.href = payUrl;
        }
    };
</script>
</body>
</html>
