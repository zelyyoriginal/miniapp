<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fullscreen Gallery</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
   margin: 0;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    color: var(--tg-theme-text-color, #000000);
    background-color: var(--tg-theme-secondary-bg-color, rgba(255,255,255,0.05));
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    text-align: center;
    padding: 20px;
}

.section {
    width: 100%;
    height: 100vh;
    border-radius: 16px;
    overflow: hidden;
}

.section img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}
.divider{
    height:12px;
    display:flex;

}




</style>

</head>
<body>

<section class="section">
    <img src="images/photo1.jpg" alt="Фото 1">
</section>
<div class="divider"></div>
<section class="section">
    <img src="images/photo2.jpg" alt="Фото 2">
</section>
<div class="divider"></div>

<section class="section">
    <img src="images/photo3.jpg" alt="Фото 3">
</section>
<div class="divider"></div>

<section class="section">
    <img src="images/photo4.jpg" alt="Фото 4">
</section>
<div class="divider"></div>

<section class="section">
    <img src="images/photo5.jpg" alt="Фото 5">
</section>


</body>
</html>
